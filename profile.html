<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Profile</title>

  <!-- ICON -->
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/png" href="OBMC LOGO for ICON.png">>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
  
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* BODY */
    body {
      display: flex;
      background: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
    }
    
    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 20px;
      position: fixed;
    }
    
    .sidebar-logo {
      display: block;
      width: 120px;
      margin: 0 auto 30px;
    }
    
    .sidebar a {
      display: block;
      color: #9ca3af;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    
    .sidebar a:hover {
      background: #1f2937;
      color: white;
    }
    
    /* CONTENT */
    .content {
      margin-left: 220px;
      width: 100%;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* CARD */
    .main-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 900px;
    }
    
    /* PROFILE IMAGE */
    .profile-pic {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 15px;
    }
    
    .file-input {
      display: block;
      margin: 0 auto 20px;
    }
    
    /* LABELS */
    label {
      font-weight: 600;
      color: #374151;
    }
    
    /* INPUTS */
    .form-control {
      border-radius: 10px;
      padding: 8px;
    }
    
    /* BUTTON */
    .button {
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      border-radius: 10px;
      padding: 10px 20px;
      border: none;
      color: white;
      font-weight: 600;
      margin-top: 20px;
    }
    
    /* FOOTER */
    .footer {
      position: fixed;
      bottom: 0;
      left: 220px;
      width: calc(100% - 220px);
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9rem;
    }
  
  </style>
  
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <img src="MAIN LOGO.png" class="rounded-circle sidebar-logo">
  <a href="index.html">Home</a>
  <a href="notebooks.html">Virtual Notebooks</a>
  <a href="tasks.html">Tasks</a>
  <a href="profile.html">Profile</a>
  <a href="calendar.html">Calendar</a>
  <a href="login.html">Logout</a>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="main-container">

    <!-- PROFILE IMAGE -->
    <img id="profilePreview" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcHVuqgJPs1mFipnjsVwsFIYiYwTaulS-1_w&s" class="profile-pic">
    <input type="file" class="file-input" accept="image/*" onchange="previewImage(event)">

    <!-- FORM -->
    <div class="row g-3">

      <div class="col-md-6">
        <label>Student ID</label>
        <input type="text" class="form-control" placeholder="SN123456">
      </div>

      <div class="col-md-6">
        <label>Contact Number</label>
        <input type="text" class="form-control" placeholder="+63">
      </div>

      <div class="col-md-6">
        <label>Email Address</label>
        <input type="email" class="form-control" placeholder="delacruz.jr@obmontessori.edu.ph">
      </div>

      <div class="col-md-6">
        <label>Gender</label>
        <input type="text" class="form-control" placeholder="Gender">
      </div>

    </div>

    <!-- BUTTON -->
    <button class="button">Change Password</button>

  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  Group 5 / 9 Ruby 25'26
</div>

<script>
function previewImage(event) {
  const input = event.target;
  const preview = document.getElementById("profilePreview");

  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      preview.src = e.target.result;
    }
    reader.readAsDataURL(input.files[0]);
  }
}
</script>

</body>
</html>
