<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Profile</title>
    
</head>
<body>
   
    <style> 
    
        body {
            background-color: #f5f7fa;
            background-size: cover;
            color: #fff;} 
    
        /* SIDEBAR */
        .sidebar {
          width: 220px;
          height: 100vh;
          background: #111827;
          color: white;
          padding: 20px;
          position: fixed;
        }
    
        /* SIDEBAR LOGO */
        .sidebar-logo {
          display: block;
          width: 120px;
          margin: 0 auto 30px;
        }
        
        .sidebar a {
          display: block;
          color: #9ca3af;
          text-decoration: none;
          padding: 10px;
          border-radius: 8px;
          margin-bottom: 10px;
          transition: 0.2s;
        }
        
        .sidebar a:hover {
          background: #1f2937;
          color: white;
        }
    
        .container {
            display: flex;
            justify-content: right;
            align-items: right;
            min-height: 90vh;
            padding: 20px;}
        
        .form-card {
            display: flex;
            flex-direction: row;
            width: 850px;
            max-width: 100%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            transition: transform 0.3s;}
        
        .form-card:hover {
            transform: translateY(-5px);}
        
        .left {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 30px;}
        
        .profile-pic {
            width: 130px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid rgba(255,255,255,0.4);}
        
        .file-input {
            color: #fff;}
        
        .right {
            width: 60%;
            padding: 30px;}
        
        .title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;}
        
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.9);
            font-size: 14px;
            transition: 0.3s;}
        
        input:focus {
            outline: none;
            box-shadow: 0 0 5px #4da3ff;}
        
        @media (max-width: 768px) {
            .form-card {
                flex-direction: column;}
            .left, .right {
                width: 100%;}}
    
    </style>
</head>
<body>

<!-- SIDEBAR -->
  <div class="sidebar">
    <img src="MAIN LOGO.png" alt="Logo" class=" rounded-circle sidebar-logo">
      <a href="index.html">Home</a>
      <a href="notebooks.html">Virtual Notebooks</a>
      <a href="tasks.html"> Tasks
      <a href="profile.html">Profile</a>
      <a href="calendar.html">Calendar</a>
      <a href="login.html">Logout</a>
  </div>

<div class="container">
    <div class="form-card">

<div class="left">
    <img id="profilePreview" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTT0aGR2KceYkMdwnmCF5KDqvMPyjvpIVLUOg&s" class="profile-pic">
    <input type="file" class="file-input" accept="image/*" onchange="previewImage(event)">
</div>

    <script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById("profilePreview");

        if (input.files && input.files[0]) {
             const reader = new FileReader();
        reader.onload = function(e) {
                preview.src = e.target.result;
        }
            reader.readAsDataURL(input.files[0]);}}

    </script>
        <div class="right">
            <div id="formNotice" class="notice" style="display:none;"></div>
            <h2 class="title"> STUDENT INFORMATION 📝 </h2>

       <div class="row">
<div class="col">
<label for="name" style="color: aliceblue;"> Student ID </label>
<input type="name" class="form-control" id="name" placeholder="SN123456" name="name">
</div>

<div class="col">
  <label for="pwd" style="color: aliceblue;"> Contact Number </label>
  <input type="name" class="form-control" id="number" placeholder="+639150000001" name="number">
</div> 

<div class="col">
  <label for="pwd" style="color: aliceblue;"> Email Address  </label>
  <input type="email" class="form-control" id="email" placeholder="delacruz.jr@obmontessori.edu.ph" name="email">
</div> 

<div class="col">
  <label for="pwd" style="color: aliceblue;"> Gender </label>
  <input type="gender" class="form-control" id="gender" placeholder="male" name="gender">
</div> 
</div>

  <button class="btn btn-light" style="color: rgb(134, 176, 131);" onclick="resetForm()"> Change Password </button>

    </div>   
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
