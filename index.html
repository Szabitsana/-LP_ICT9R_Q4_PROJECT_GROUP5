<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>HOME PAGE</title>

  <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" href="OBMC LOGO for ICON.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
  
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* BODY */
    body {
      display: flex;
      background: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
    }
    
    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 20px;
      position: fixed;
    }

    /* SIDEBAR LOGO */
    .sidebar-logo {
      display: block;
      width: 120px;
      margin: 0 auto 30px;
    }
    
    .sidebar a {
      display: block;
      color: #9ca3af;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    
    .sidebar a:hover {
      background: #1f2937;
      color: white;
    }
    
    /* CONTENT */
    .content {
      margin-left: 220px;
      width: 100%;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    /* MAIN CARD */
    .main-container {
      background-color: #ffffff;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      max-width: 1000px;
      width: 100%;
    }
    
    /* TEXT */
    .title-text {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1e3a5f;
    }
    
    .subtitle {
      color: #6b7280;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    
    /* IMAGE */
    .image-box img {
      max-width: 100%;
      border-radius: 12px;
    }
    
    /* BUTTON */
    .button {
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      border-radius: 10px;
      padding: 12px 24px;
      border: none;
      color: white;
      font-weight: 600;
      margin-top: 20px;
      transition: 0.2s;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    
    /* FOOTER */
    .footer {
      position: fixed;
      bottom: 0;
      left: 220px;
      width: calc(100% - 220px);
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9rem;
    }
    
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<img src="MAIN LOGO.png" alt="Logo" class=" rounded-circle sidebar-logo">
  <a href="index.html">Home</a>
  <a href="notebooks.html">Virtual Notebooks</a>
  <a href="profile.html">Profile</a>
  <a href="calendar.html">Calendar</a>
  <a href="login.html">Logout</a>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="main-container">

    <div class="row align-items-center g-4">

      <div class="col-md-6">
        <h1 class="title-text">
          OB MONTESSORI CENTER
        </h1>
        <p class="subtitle">
          Educating Future Leaders.
        </p>

        <button class="button" onclick="window.location.href='login.html'">
          Get Started
        </button>
      </div>

      <div class="col-md-6 text-center image-box">
        <img src="Generations.jpeg" alt="school">
      </div>

    </div>

  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  Group 5 / 9 Ruby 25'26
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
