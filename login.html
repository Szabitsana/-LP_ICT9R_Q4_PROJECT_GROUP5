<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login</title>
    
    <!-- ICON -->
    <link rel="icon" type="image/png" href="OBMC LOGO for ICON.png">
    
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
    
        /* BODY */
        body{
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* MAIN LAYOUT */
        .main-wrapper{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
        }
        
        /* LOGIN BOX */
        .container{
            background: white;
            border-radius: 25px;
            padding: 30px;
            width: 335px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }
        
        /* RIGHT IMAGE */
        .side-image{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .side-image img{
            max-width: 500px;
            width: 100%;
            opacity: 0.15; /* transparent effect */
        }
        
        /* INPUT */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 5px 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 15px;
            text-align: center;
        }
        
        /* BUTTONS */
        input[type="submit"] {
            background-color: lightslategray;
            color: white;
            padding: 5px;
            border-radius: 10px;
            border: none;
            width: 100%;
        }
        
        input[type="reset"] {
            background-color: rgb(177, 186, 194);
            color: white;
            padding: 5px;
            border-radius: 10px;
            border: none;
            width: 100%;
            margin-top: 5px;
        }
        
        /* FOOTER (FIXED + FULL WIDTH) */
        .footer {
            width: 100%;
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 10px 0;
            font-size: 0.9rem;
        }
    
    </style>
</head>

<body>

<div class="main-wrapper">

    <!-- LOGIN BOX -->
    <div class="container">

        <!-- Logo -->
        <img src="OBMC LOGO2.png" alt="logo" height="50" style="display:block; margin:auto;">

        <br>

        <h4 class="text-center"><b>Login</b></h4>

        <form onsubmit="authenticate(event)">

            <label style="font-weight:bold;">Username</label>
            <input type="text" id="UID" placeholder="Enter Username" required>

            <label style="font-weight:bold;">Password</label>
            <input type="password" id="PW" placeholder="Enter Password" required>

            <div class="form-check form-switch text-start mt-3">
                <input class="form-check-input" type="checkbox" id="stayLoggedIn" onclick="toggleStay()">
                <label class="form-check-label">Stay logged in</label>
            </div>

            <div id="stayDetails" style="display:none;" class="mt-2">
                <p style="color:#6d6d6d;"><i>Your session will stay active on this device.</i></p>
            </div>

            <input type="submit" value="Login">
            <input type="reset" value="Cancel">

            <div style="margin-top:15px; color:#8deaff; font-weight:bold;">
                <p id="displayattempts"></p>
            </div>

            <center>
                <a style="color:#6d6d6d;" href="#">Forgot username / password?</a>
            </center>

        </form>
    </div>

    
    <div class="transp">
        <img src="OBMC LOGO2.png alt="side-image> 
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    Group 5 / 9 Ruby 25'26
</div>

<script>

let attempts = 0; 
const maxAttempts = 3;

function authenticate(event) {
    event.preventDefault();

    var username = document.getElementById("UID").value;
    var password = document.getElementById("PW").value;

    if (username === "student01" && password === "12345678") {
        alert("Login successful!");
        window.location.href = "profile.html";
    } else {
        attempts++;
        let remaining = maxAttempts - attempts;

        alert("Incorrect username or password!");

        document.getElementById("displayattempts").innerHTML =
            "Attempts left: " + remaining;

        if (attempts >= maxAttempts) {
            alert("Too many failed attempts.");
        }
    }
}

function toggleStay() {
    let cb = document.getElementById("stayLoggedIn");
    document.getElementById("stayDetails").style.display = cb.checked ? "block" : "none";
}

</script>

</body>
</html>
