<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- ICON -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" href="OBMC LOGO for ICON.png">

    <!-- BOOTSTRAP LINK -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- STYLE -->
    <style>
        /* Style for body */
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            background-color: #f5f7fa;
            margin-top: 50px;
        }

        /* Style for container */
        .container{
            background: rgb(255, 255, 255);
            border: 1px solid #ccc;
            border-radius: 25px;
            border: none;
            padding: 30px;
            width: 335px;
            max-width: 100%;
            margin: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        /* Style for input */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 5px 10px;
            margin: 5px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
            border-radius: 15px;
            text-align: center;
        }

        /* Style for button Submit*/
        input[type="submit"] {
            background-color: lightslategray;
            color: white;
            padding: 5px;
            border-radius: 10px;
            border: none;
            width: 100%;
        }

        /* Style for button Reset*/
        input[type="reset"] {
            background-color: rgb(177, 186, 194);
            color: white;
            padding: 5px;
            border-radius: 10px;
            border: none;
            width: 100%;
        }

        /* Style for output */
        output{
            margin-top: 15px;
            text-align: left;
        }

        /* Label */
        label {
            display: block;
            margin-top: 10px;
        }
        
        /* The 'off' state background */
        .slider {
            background-color: #ccc; 
        }

        /* The 'on' state background */
        input:checked + .slider {
            background-color: rgb(143, 201, 176); /* Change this to your desired color */
        }


        .form-check-input:checked {
            background-color: #8bddf0;
            border-color: #8bddf0;
        }


    </style>

</head>
<body>

    <!-- BOX -->
    <div class="container justify-content">

        <!-- Logo -->
            <a href="file:///C:/Users/nahar/OneDrive/Documents/Desktop/Laspinas_ICT9Ruby_Q4Project_GroupNo5/OBMC%20LOGO2.png" target="_blank">
                <img src="OBMC LOGO2.png" alt="logo" height=50px style="display: block; margin: auto;">
            </a>
        
        <br>

        <!-- Login Heading -->
        <h4><center><b>Login</b></center></h4>
    
        <!-- Whole Form -->
        <form onsubmit="authenticate(event)">

            <!-- Username -->
            <label for="username" style="text-align: center; font-weight: bold;">Username</label>
            <input type="text" id="UID" placeholder="Enter Username" required>

            <!-- Password -->
            <label for="password" style="text-align: center; font-weight: bold;">Password</label>
            <input type="password" id="PW" placeholder="Enter Password" required>

            <!-- Check Box for Toggle (Stay logged in) -->
                <div class="form-check form-switch text-start mt-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="stayLoggedIn" onclick="toggleStay()" style="cursor: w-resize;">
                    <label class="form-check-label">
                        <p>Stay logged in</p>
                    </label>
                </div>

            <!-- Hidden Details -->
            <div id="stayDetails" style="display:none;" class="mt-2">
            <p class="note" style="color: #6d6d6d;"><i>Your session will stay active on this device.</i></p>
            </div>
            
            <!-- Submit Btn -->
            <input type="submit" value="Login">

            <!-- Cancel Btn -->
            <input style="margin-top: 2px;" type="reset" value="Cancel">


            <!-- Result Display -->
            <div class="result" style="margin-top: 15px; text-align: left; color:  rgb(141, 234, 255); font-weight: bold;">
                <p id="displayattempts"></p>
            </div>

            <!-- Example Link (not actual link for actual use)-->
            <center><a style="color: #6d6d6d;"  href="https://support.google.com/accounts/thread/209067421/i-forgot-my-username-and-password?hl=en" target="_self">Forgot username / password?</a></center>
        </form>
    
    </div>

    <script>

                let attempts = 0; 
        const maxAttempts = 3;

        function authenticate(event) {
            event.preventDefault(); // stop reload

            var username = document.getElementById("UID").value;
            var password = document.getElementById("PW").value;

            if (username === "student01" && password === "12345678") {
                alert("Login successful! Welcome, " + username + "!");
                window.location.href = "index.html";
            } else {
                attempts++; // increase attempts

                let remaining = maxAttempts - attempts;

                alert("Incorrect username or password!");

                // display attempts
                document.getElementById("displayattempts").innerHTML =
                    "⚠ Attempts left: " + remaining;

                if (attempts >= maxAttempts) {
                    alert("Too many failed attempts. Login disabled.");
                    document.getElementById("Submit").disabled = true;

                    document.getElementById("displayattempts").innerHTML =
                        "❌ Maximum attempts reached.";
                }
            }
        }

        function toggleStay() {
            let cb = document.getElementById("stayLoggedIn");
            document.getElementById("stayDetails").style.display = cb.checked ? "block" : "none";
        }
    </script>
    
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
