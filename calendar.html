<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <title>School Calendar</title>

  <!-- ICON -->
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/png" href="OBMC LOGO for ICON.png">

  <style>
  
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    
    /* BODY */
    body {
      display: flex;
      background: #f5f7fa;
    }
    
    /* SIDEBAR (MATCHED TO HOMEPAGE) */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 20px;
      position: fixed;
    }
    
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .sidebar a {
      display: block;
      color: #9ca3af;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    
    .sidebar a:hover {
      background: #1f2937;
      color: white;
    }
    
    /* MAIN */
    .main {
      margin-left: 220px;
      width: 100%;
      padding: 30px;
    }
    
    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 28px;
    }
    
    .header p {
      color: gray;
    }
    
    /* CALENDAR */
    .calendar {
      margin-top: 20px;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    /* DAYS */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
      color: #555;
    }
    
    /* DATES */
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    
    /* DATE BOX */
    .date {
      background: #f9fafb;
      padding: 15px;
      border-radius: 10px;
      min-height: 80px;
      transition: 0.3s;
    }
    
    .date:hover {
      background: #e5e7eb;
    }
    
    .date span {
      font-weight: bold;
      font-size: 14px;
    }
    
    /* EVENT */
    .event {
      margin-top: 5px;
      font-size: 12px;
      color: #6366f1;
    }
    
    /* EMPTY CELLS */
    .empty {
      visibility: hidden;
    }
  
  </style>

</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <img src="MAIN LOGO.png" alt="Logo" class=" rounded-circle sidebar-logo">
      <a href="index.html">Home</a>
      <a href="notebooks.html">Virtual Notebooks</a>
      <a href="tasks.html"> Tasks
      <a href="profile.html">Profile</a>
      <a href="calendar.html">Calendar</a>
      <a href="login.html">Logout</a>
  </div>

<!-- MAIN -->
<div class="main">
  <div class="header">
    <div>
      <h1>SCHOOL CALENDAR</h1>
      <p>MAY 2026</p>
    </div>
  </div>

  <div class="calendar">

    <!-- DAYS -->
    <div class="days">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <!-- DATES -->
    <div class="dates">

      <!-- FILLER -->
      <div class="empty"></div>
      <div class="empty"></div>
      <div class="empty"></div>
      <div class="empty"></div>
      <div class="empty"></div>

      <!-- WEEK 1 -->
      <div class="date">
        <span>1</span>
        <div class="event">Labor Day</div>
      </div>
      <div class="date"><span>2</span></div>

      <!-- WEEK 2 -->
      <div class="date"><span>3</span></div>
      <div class="date"><span>4</span></div>
      <div class="date"><span>5</span></div>
      <div class="date"><span>6</span></div>
      <div class="date"><span>7</span></div>
      <div class="date"><span>8</span></div>
      <div class="date"><span>9</span></div>

      <!-- WEEK 3 -->
      <div class="date"><span>10</span></div>
      <div class="date"><span>11</span></div>
      <div class="date"><span>12</span></div>
      <div class="date"><span>13</span></div>
      <div class="date"><span>14</span></div>
      <div class="date"><span>15</span></div>
      <div class="date"><span>16</span></div>

      <!-- WEEK 4 -->
      <div class="date"><span>17</span></div>
      <div class="date"><span>18</span></div>
      <div class="date"><span>19</span></div>
      <div class="date">
        <span>20</span>
        <div class="event">Event here</div>
      </div>
      <div class="date"><span>21</span></div>
      <div class="date"><span>22</span></div>
      <div class="date"><span>23</span></div>

      <!-- WEEK 5 -->
      <div class="date"><span>24</span></div>
      <div class="date"><span>25</span></div>
      <div class="date"><span>26</span></div>
      <div class="date"><span>27</span></div>
      <div class="date"><span>28</span></div>
      <div class="date"><span>29</span></div>
      <div class="date"><span>30</span></div>

      <!-- WEEK 6 -->
      <div class="date"><span>31</span></div>

    </div>

  </div>
</div>

</body>
</html>
